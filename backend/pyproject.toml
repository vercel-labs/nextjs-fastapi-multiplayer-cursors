[project]
name = "vercel-fastapi-starter"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "certifi>=2025.11.12",
  "fastapi>=0.121.0",
  "jinja2>=3.1.4",
  "pydantic-settings>=2.2.1",
  "redis>=5.0",
  "uvicorn[standard]>=0.34.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]
