[project]
name = "vercel-flask-starter"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "certifi>=2025.11.12",
  "fastapi>=0.124.0",
  "redis>=5.0",
  "uvicorn[standard]>=0.38.0",
]

[tool.setuptools]
py-modules = ["main", "items", "collaboration"]

[tool.vercel]
entrypoint = "main:app"
